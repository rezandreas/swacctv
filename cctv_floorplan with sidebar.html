<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CCTV Floor Plan Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: sans-serif;
    background: #f0efea;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top header ── */
  .topbar {
    background: #1a1a2e;
    color: white;
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .topbar-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .topbar-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    margin-left: 10px;
  }
  .topbar-right {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
  }

  /* ── Main layout ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 160px;
    background: #12122a;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.25);
    padding: 16px 14px 8px;
  }
  .floor-btn {
    display: flex;
    flex-direction: column;
    padding: 10px 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    gap: 2px;
  }
  .floor-btn:hover {
    background: rgba(255,255,255,0.06);
  }
  .floor-btn.active {
    background: rgba(226,75,74,0.15);
    border-left-color: #E24B4A;
  }
  .floor-name {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
  }
  .floor-btn.active .floor-name {
    color: white;
  }
  .floor-cam-count {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
  }
  .floor-btn.active .floor-cam-count {
    color: rgba(226,75,74,0.9);
  }

  /* ── Floor plan area ── */
  .content {
    flex: 1;
    overflow: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .floor-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .floor-title {
    font-size: 16px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .cam-badge {
    background: #E24B4A;
    color: white;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 20px;
  }

  .floorplan-wrap {
    position: relative;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    display: inline-block;
    width: 100%;
  }
  .floorplan-wrap img.fp {
    width: 100%;
    display: block;
  }

  /* ── Camera markers ── */
  .cam-marker {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 10;
  }
  .cam-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #E24B4A;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .cam-btn:hover { background: #A32D2D; transform: scale(1.07); }
  .cam-btn:active { transform: scale(0.97); }
  .cam-icon {
    width: 8px; height: 8px;
    background: white;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
  }
  .cam-icon::after {
    content: '';
    position: absolute;
    right: -5px; top: 50%;
    transform: translateY(-50%);
    border-left: 5px solid white;
    border-top: 3px solid transparent;
    border-bottom: 3px solid transparent;
  }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 12px;
    width: 420px;
    max-width: 94vw;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .modal-photo {
    width: 100%;
    height: 240px;
    background: #111;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-photo img.snap {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  /*
    CARA PAKAI FOTO:
    Isi field "photo" di data kamera dengan path relatif atau URL.
    Contoh: 'foto/cam_18_1.jpg' atau 'http://192.168.18.1/snap.jpg'
  */
  .no-photo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0.35;
  }
  .no-photo svg { width: 60px; height: 45px; }
  .no-photo span { color: white; font-size: 12px; }
  .cam-label-badge {
    position: absolute;
    top: 10px; left: 10px;
    background: rgba(0,0,0,0.55);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 4px;
  }
  .modal-body { padding: 1rem 1.25rem; }
  .modal-ip { font-size: 16px; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; }
  .info-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 5px 14px;
    font-size: 13px;
  }
  .info-label { color: #888; }
  .info-val { color: #1a1a1a; font-weight: 500; }
  .modal-footer {
    padding: 10px 1.25rem;
    border-top: 1px solid #eee;
    display: flex;
    justify-content: flex-end;
  }
  .close-btn {
    background: transparent;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 7px 18px;
    font-size: 13px;
    cursor: pointer;
    color: #444;
  }
  .close-btn:hover { background: #f5f5f5; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <span class="topbar-title">CCTV Monitor</span>
    <span class="topbar-sub">Floor Plan View</span>
  </div>
  <div class="topbar-right" id="topbar-info">— kamera aktif</div>
</div>

<div class="main">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-label">LANTAI</div>
    <div id="floor-list"></div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="floor-header">
      <span class="floor-title" id="active-floor-title">-</span>
      <span class="cam-badge" id="active-cam-count">0 kamera</span>
    </div>
    <div class="floorplan-wrap" id="floorplan">
      <img class="fp" id="fp-img" src="floorplan.png" alt="Denah lantai" />
    </div>
  </div>

</div>

<!-- Modal popup -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-photo" id="modal-photo"></div>
    <div class="modal-body">
      <div class="modal-ip" id="modal-ip">-</div>
      <div class="info-grid">
        <span class="info-label">Lantai</span>
        <span class="info-val" id="modal-floor">-</span>
        <span class="info-label">Lokasi</span>
        <span class="info-val" id="modal-loc">-</span>
        <span class="info-label">Ruangan</span>
        <span class="info-val" id="modal-room">-</span>
        <span class="info-label">Tipe</span>
        <span class="info-val" id="modal-type">-</span>
        <span class="info-label">Status</span>
        <span class="info-val" style="color:#1D9E75">● Online</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="close-btn" id="close-btn">Tutup</button>
    </div>
  </div>
</div>

<script>
/**
 * DATA LANTAI & KAMERA
 *
 * Tambah / hapus objek di array "floors" sesuai gedung kamu.
 * Setiap lantai punya:
 *   - id        : unik, bebas
 *   - name      : nama yang tampil di sidebar & header
 *   - floorplan : path gambar denah (taruh di folder yang sama atau subfolder)
 *   - cameras   : array kamera di lantai itu
 *
 * Setiap kamera:
 *   - ip    : IP address kamera
 *   - x, y  : posisi marker dalam % terhadap lebar/tinggi gambar denah
 *   - room  : nama ruangan
 *   - loc   : deskripsi lokasi
 *   - type  : tipe kamera
 *   - photo : path foto / snapshot (relatif atau URL absolut)
 */
const floors = [
  {
    id: 'lt1',
    name: 'Lantai 1',
    floorplan: 'floorplan_lt1.png',
    cameras: [
      { ip:'192.168.18.1',  x:88.5, y:49,  room:'3163',   loc:'Pojok kanan',            type:'Dome Indoor',  photo:'foto/cam_18_1.jpg'  },
      { ip:'192.168.18.2',  x:77,   y:22,  room:'3171',   loc:'Pintu masuk kanan atas', type:'Bullet',       photo:'foto/cam_18_2.jpg'  },
      { ip:'192.168.18.3',  x:80,   y:56,  room:'3163',   loc:'Koridor kanan tengah',   type:'Dome Indoor',  photo:'foto/cam_18_3.jpg'  },
      { ip:'192.168.18.4',  x:55,   y:68,  room:'3140',   loc:'Tengah bawah',           type:'Dome Indoor',  photo:'foto/cam_18_4.jpg'  },
      { ip:'192.168.18.5',  x:58,   y:54,  room:'3170',   loc:'Tangga tengah',          type:'Dome Indoor',  photo:'foto/cam_18_5.jpg'  },
      { ip:'192.168.18.6',  x:57,   y:36,  room:'Piazza', loc:'Pintu tengah atas',      type:'Dome Indoor',  photo:'foto/cam_18_6.jpg'  },
      { ip:'192.168.18.7',  x:76,   y:11,  room:'3171',   loc:'Pintu kanan atas',       type:'Bullet',       photo:'foto/cam_18_7.jpg'  },
      { ip:'192.168.18.8',  x:62,   y:10,  room:'3171',   loc:'Atas tengah',            type:'Bullet',       photo:'foto/cam_18_8.jpg'  },
      { ip:'192.168.18.9',  x:58,   y:86,  room:'3140',   loc:'Bawah tengah',           type:'Dome Indoor',  photo:'foto/cam_18_9.jpg'  },
      { ip:'192.168.18.10', x:34,   y:87,  room:'3130',   loc:'Pojok kiri bawah',       type:'Bullet',       photo:'foto/cam_18_10.jpg' },
      { ip:'192.168.18.11', x:23,   y:72,  room:'3120',   loc:'Sisi kiri bawah',        type:'Dome Indoor',  photo:'foto/cam_18_11.jpg' },
      { ip:'192.168.18.12', x:25,   y:44,  room:'3110',   loc:'Sisi kiri tengah',       type:'Dome Indoor',  photo:'foto/cam_18_12.jpg' },
      { ip:'192.168.18.13', x:77,   y:66,  room:'3140',   loc:'Kanan bawah',            type:'Dome Indoor',  photo:'foto/cam_18_13.jpg' },
      { ip:'192.168.18.14', x:18,   y:14,  room:'3110',   loc:'Pojok kiri atas',        type:'Bullet',       photo:'foto/cam_18_14.jpg' },
      { ip:'192.168.18.23', x:12,   y:55,  room:'3120',   loc:'Pintu sisi kiri',        type:'Dome Outdoor', photo:'foto/cam_18_23.jpg' },
      { ip:'192.168.18.35', x:42,   y:39,  room:'Piazza', loc:'Tengah Piazza kiri',     type:'Dome Indoor',  photo:'foto/cam_18_35.jpg' },
    ]
  },
  {
    id: 'lt2',
    name: 'Lantai 2',
    floorplan: 'floorplan_lt2.png',
    cameras: [
      { ip:'192.168.19.1',  x:20,   y:25,  room:'2110',   loc:'Pojok kiri atas',        type:'Dome Indoor',  photo:'foto/cam_19_1.jpg'  },
      { ip:'192.168.19.2',  x:75,   y:30,  room:'2120',   loc:'Koridor kanan',          type:'Bullet',       photo:'foto/cam_19_2.jpg'  },
      { ip:'192.168.19.3',  x:50,   y:60,  room:'2130',   loc:'Tengah ruangan',         type:'Dome Indoor',  photo:'foto/cam_19_3.jpg'  },
    ]
  },
  {
    id: 'ltb1',
    name: 'Basement 1',
    floorplan: 'floorplan_b1.png',
    cameras: [
      { ip:'192.168.20.1',  x:30,   y:40,  room:'B110',   loc:'Parkir barat',           type:'Dome Outdoor', photo:'foto/cam_20_1.jpg'  },
      { ip:'192.168.20.2',  x:70,   y:40,  room:'B110',   loc:'Parkir timur',           type:'Dome Outdoor', photo:'foto/cam_20_2.jpg'  },
      { ip:'192.168.20.3',  x:50,   y:70,  room:'B120',   loc:'Pintu keluar',           type:'Bullet',       photo:'foto/cam_20_3.jpg'  },
    ]
  },
];

let activeFloor = floors[0];
const fp       = document.getElementById('floorplan');
const fpImg    = document.getElementById('fp-img');
const overlay  = document.getElementById('modal-overlay');
const photoBox = document.getElementById('modal-photo');

function noPhotoHTML() {
  return `<div class="no-photo">
    <svg viewBox="0 0 64 48" fill="none">
      <rect x="2" y="10" width="36" height="28" rx="4" fill="white"/>
      <polygon points="38,14 62,4 62,44 38,34" fill="white"/>
      <circle cx="18" cy="24" r="8" fill="#111"/>
      <circle cx="18" cy="24" r="4" fill="#444"/>
    </svg>
    <span>Foto tidak tersedia</span>
  </div>`;
}

function buildSidebar() {
  const list = document.getElementById('floor-list');
  list.innerHTML = '';
  let total = 0;
  floors.forEach(floor => {
    total += floor.cameras.length;
    const btn = document.createElement('div');
    btn.className = 'floor-btn' + (floor.id === activeFloor.id ? ' active' : '');
    btn.dataset.id = floor.id;
    btn.innerHTML = `<span class="floor-name">${floor.name}</span>
                     <span class="floor-cam-count">${floor.cameras.length} kamera</span>`;
    btn.addEventListener('click', () => switchFloor(floor.id));
    list.appendChild(btn);
  });
  document.getElementById('topbar-info').textContent = total + ' kamera aktif';
}

function switchFloor(id) {
  activeFloor = floors.find(f => f.id === id);
  buildSidebar();
  loadFloor();
}

function loadFloor() {
  document.getElementById('active-floor-title').textContent = activeFloor.name;
  document.getElementById('active-cam-count').textContent = activeFloor.cameras.length + ' kamera';
  fpImg.src = activeFloor.floorplan;
  document.querySelectorAll('.cam-marker').forEach(e => e.remove());
  if (fpImg.complete && fpImg.naturalWidth > 0) {
    placeMarkers();
  }
}

function placeMarkers() {
  document.querySelectorAll('.cam-marker').forEach(e => e.remove());
  activeFloor.cameras.forEach(cam => {
    const marker = document.createElement('div');
    marker.className = 'cam-marker';
    marker.style.left = cam.x + '%';
    marker.style.top  = cam.y + '%';
    marker.innerHTML = `<button class="cam-btn" title="${cam.ip} — ${cam.loc}">
      <span class="cam-icon"></span>${cam.ip}
    </button>`;
    marker.querySelector('button').addEventListener('click', () => openModal(cam));
    fp.appendChild(marker);
  });
}

fpImg.addEventListener('load', placeMarkers);

function openModal(cam) {
  document.getElementById('modal-ip').textContent    = cam.ip;
  document.getElementById('modal-floor').textContent = activeFloor.name;
  document.getElementById('modal-loc').textContent   = cam.loc;
  document.getElementById('modal-room').textContent  = cam.room;
  document.getElementById('modal-type').textContent  = cam.type;

  if (cam.photo) {
    photoBox.innerHTML = `
      <img class="snap" src="${cam.photo}" alt="Foto ${cam.ip}"
           onerror="this.parentElement.innerHTML=noPhotoHTML()" />
      <span class="cam-label-badge">${cam.ip}</span>
    `;
  } else {
    photoBox.innerHTML = noPhotoHTML();
  }

  overlay.classList.add('open');
}

document.getElementById('close-btn').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

buildSidebar();
loadFloor();
</script>
</body>
</html>
